<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Member Management - PowerFit</title>

    <link rel="stylesheet" href="members.css">

</head>

<body>


    <!-- Sidebar Logo -->

    <div class="sidebar-logo">

        <img src="../../Imag/ChatGPT Image Sep 4, 2026, 07_11_46 PM.png" alt="PowerFit Logo">

        <h1>PowerFit</h1>

    </div>



    <!-- Sidebar -->

    <div class="sidebar">

        


        <nav class="sidebar-menu">

            <a href="../dashboard/Admin.html" class="menuitem">
                Dashboard
            </a>

            <a href="../member/members.html" class="menuitem active">
                Members
            </a>

            <a href="../trainer/trainer.html" class="menuitem">
                Trainers
            </a>

            <a href="../membership/memberships.html" class="menuitem">
                Memberships
            </a>

            <a href="../Classes/classes.html" class="menuitem">
                Classes & Schedules
            </a>

            <a href="../attendance/attendance.html" class="menuitem">
                Attendance
            </a>

            <a href="../payments/payments.html" class="menuitem">
                Payments
            </a>

        

            


        </nav>


        <div class="sidebar-bottom">

            <a href="../../index.html" class="Logout">
                Logout
            </a>

        </div>

    </div>



    <!-- Main Content -->

    <main class="main-content">


        <!-- Page Header -->

        <section class="page-header">

            <div>

                <h1>Member Management</h1>

                <p>Manage all gym members</p>

            </div>


            <button id="addMemberBtn">
                + Add Member
            </button>

        </section>



        <!-- Search and Filter -->

        <section class="member-controls">

            <div class="search-box">

                <input
                    type="text"
                    id="searchMember"
                    placeholder="Search member..."
                >

            </div>


            <div class="filter-box">

                <select id="memberStatus">

                    <option value="">
                        All Status
                    </option>

                    <option value="Active">
                        Active
                    </option>

                    <option value="Expired">
                        Expired
                    </option>

                    <option value="Suspended">
                        Suspended
                    </option>

                </select>

            </div>

        </section>



        <!-- Members Table -->

        <section class="members-table-section">

            <h2>Members List</h2>


            <!-- Horizontal Overflow -->

            <div class="table-wrapper">

                <table>

                    <thead>

                        <tr>

                            <th>ID</th>

                            <th>Member Name</th>

                            <th>Email</th>
                            <th>Phone</th>

                            <th>CNIC</th>

                            <th>Membership</th>
                            <th>Durtion</th>

                            <th>Join Date</th>

                            <th>Expiry Date</th>
                            <th>Gender</th>
                            <th>Address</th>

                            <th>Status</th>

                            <th>Actions</th>

                        </tr>

                    </thead>


                    <tbody id="membersTableBody">



                    </tbody>

                </table>

            </div>

        </section>
        </main>

        <script src="members.js"></script>
    

</body>

</html>

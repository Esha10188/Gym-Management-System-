<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Membership Management - PowerFit</title>

    <link rel="stylesheet" href="memberships.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="sidebar-logo">
            <img src="../../imag/ChatGPT Image Sep 4, 2026, 07_11_46 PM.png" alt="PowerFit Logo">
            <h1>PowerFit</h1>
        </div>



        <nav class="sidebar-menu">

            <a href="../dashboard/Admin.html" class="menuitem">
                Dashboard
            </a>

            <a href="../member/members.html" class="menuitem">
                Members
            </a>

            <a href="../trainer/trainer.html" class="menuitem">
                Trainers
            </a>

            <a href="../membership/memberships.html" class="menuitem active">
                Memberships
            </a>

            <a href="../classes/classes.html" class="menuitem">
                Classes & Schedules
            </a>

            <a href="../attendance/attendance.html" class="menuitem">
                Attendance
            </a>

            <a href="../payments/payments.html" class="menuitem">
                Payments
            </a>

        </nav>

        <div class="sidebar-bottom">

            <a href="../../index.html" class="Logout">
                Logout
            </a>

        </div>

    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <!-- ================= PAGE HEADER ================= -->

        <section class="page-header">

            <div>
                <h1>Membership Management</h1>
                <p>Manage PowerFit membership plans</p>
            </div>

            <button id="addMembershipBtn">
                + Add Membership
            </button>

        </section>


        <!-- ================= SEARCH & FILTER ================= -->

        <section class="membership-controls">

            <input type="text" id="searchMembership" placeholder="Search membership...">

            <select id="membershipStatusFilter">

                <option value="">All Status</option>

                <option value="Active">
                    Active
                </option>

                <option value="Inactive">
                    Inactive
                </option>

            </select>

        </section>


        <!-- ================= MEMBERSHIP LIST ================= -->

        <section class="membership-list">

            <h2>Membership Plans</h2>

            <div class="table-wrapper">

                <table>

                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Membership</th>
                            <th>Duration</th>
                            <th>Price</th>
                            <th>Discount</th>
                            <th>Final Price</th>
                            <th>Trainer</th>
                            <th>Member Limit</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="membershipsTableBody"> </tbody>
                </table>
            </div>
        </section>
        <script src="memberships.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trainer Management - PowerFit</title>

    <link rel="stylesheet" href="trainer.css">
</head>

<body>

    <!-- ================= SIDEBAR ================= -->

    <div class="sidebar">

        <div class="sidebar-logo">
            <img src="../../Imag/ChatGPT Image Sep 4, 2026, 07_11_46 PM.png" alt="PowerFit Logo">
            <h1>PowerFit</h1>
        </div>


        <nav class="sidebar-menu">

            <a href="../dashboard/admin.html" class="menuitem">
                Dashboard
            </a>

            <a href="../member/members.html" class="menuitem">
                Members
            </a>

            <a href="../trainer/trainer.html" class="menuitem active">
                Trainers
            </a>

            <a href="../membership/memberships.html" class="menuitem">
                Memberships
            </a>

            <a href="../classes/classes.html" class="menuitem">
                Classes & Schedules
            </a>

            <a href="../attendance/attendance.html" class="menuitem">
                Attendance
            </a>

            <a href="../payments/payments.html" class="menuitem">
                Payments
            </a>
 </nav>

        <div class="sidebar-bottom">
            <a href="../../index.html" class="Logout">
                Logout
            </a>
        </div>

    </div>


    <!-- ================= MAIN CONTENT ================= -->

    <main class="main-content">

        <!-- Page Header -->

        <section class="page-header">

            <div>
                <h1>Trainer Management</h1>
                <p>Manage PowerFit trainers</p>
            </div>

            <button id="addTrainerBtn">
                + Add Trainer
            </button>

        </section>


        <!-- ================= SEARCH & FILTER ================= -->

        <section class="trainer-controls">

            <input type="text" id="searchTrainer" placeholder="Search trainer...">

            <select id="trainerStatusFilter">

                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>

            </select>

        </section>


        <!-- ================= TRAINER TABLE ================= -->

        <section class="trainer-list" id="trainertablebody">

            <h2>Trainer List</h2>

            <div class="table-wrapper">

                <table>
                <tbody>
                    <thead>

                        <tr>
                            <th>ID</th>
                            <th>Trainer Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>CNIC</th>
                            <th>Specialization</th>
                            <th>Experience</th>
                            <th>Join Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>

                    </thead>
                </tbody>

                </table>

            </div>

        </section>
    </main>
    <script src="trainer.js"></script>
</body>

</html>
